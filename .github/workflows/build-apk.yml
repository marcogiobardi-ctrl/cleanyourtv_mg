name: Build IRIS Skyworth Android 11 APK

on:
  workflow_dispatch:

jobs:
  build:
    # Explicitly locks onto a known stable image to avoid environment variance
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Inject Android 11 & TV Architecture Config
        run: |
          # Forces compilation targets to align safely with Android 11 (API 30)
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 30/g' {} +
          find . -name "build.gradle" -exec sed -i 's/targetSdk [0-9]*/targetSdk 30/g' {} +
          
          # Adds architecture restrictions matching Skyworth core media chips
          find . -name "build.gradle" -exec sed -i '/ndk {/a \ \ \ \ \ \ \ \ \ \ \ \ abiFilters "armeabi-v7a", "arm64-v8a"' {} +

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f "launcher/gradlew" ]; then
            chmod +x launcher/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Compile Optimized TV APK
        run: |
          if [ -d "launcher" ] && [ -f "launcher/gradlew" ]; then
            cd launcher && ./gradlew assembleRelease
          else
            ./gradlew assembleRelease
          fi

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-Skyworth-CleanYourTV-APK
          path: '**/build/outputs/apk/release/*-unsigned.apk'
