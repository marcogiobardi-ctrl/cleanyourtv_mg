name: Compile CleanYourTV Skyworth APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build launcher APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Show APK
        run: ls -la launcher/app/build/outputs/apk/release/

      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-Skyworth-CleanYourTV-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
